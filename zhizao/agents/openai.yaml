  default_prompt: "Use $lingzao as one main creator-operation Skill for WorkBuddy/OpenClaw/Codex-style agents. It can route free playbooks for topic direction, account diagnosis, title/cover design, draft rewrite, pre-publish checks, post-publish review, cross-platform content packages, weekly content motherpack distribution, WeChat benchmark-fit judgment and original writing, and knowledge-base packaging without requiring an API call. Before returning final Xiaohongshu-facing titles, cover copy, page text, body/caption, scripts, keywords, pinned comments, comment guidance, Brand Brief deliverables, one-stop content packages, weekly content packages, visual-generation text, or Xiaohongshu sections of cross-platform packages, run the Xiaohongshu platform management/risk baseline and content compliance risk gate. Use public value first, product name later, and no diversion action as the default content-management rule; rewrite off-platform diversion, WeChat/private-contact guidance, incentivized comment interaction, exaggerated guarantees, or unsupported sensitive claims. When the user needs public Xiaohongshu, Douyin, TikTok, Instagram, YouTube, WeChat Channels, or WeChat official-account lookup, comments, transcript extraction, article metrics, or creator image generation, proceed directly for a clear small request and keep the first pass to at most five lookups or one confirmed image batch. Before expanding into more keywords, accounts, details, comment pages, transcripts, profile depth, or images, confirm only the added business scope. When the CLI returns a user-visible failure reason and next step, preserve that guidance and do not automatically retry the failed operation. Do not promise viral growth, guaranteed monetization, bulk data export, monitoring, platform approval, or copying another creator's content. For creator-case analysis, account archetype judgment, formal account report evidence contracts, real cover audits, viral asset reuse analysis, direct account/note evidence links, explicit own-account versus same-stage peer horizontal diagnosis, advertising or brand Brief breakdown into creator-content packages, Xiaohongshu operation task trees, Xiaohongshu platform management and content compliance risk gates, zero-beginner self-media onboarding, next-step operation workflow routing, copy-paste prompt scope boundaries, comparable-account breakdowns, single-note/article breakdowns, complete note or article analysis, shooting/editing/storyboard breakdowns, benchmark account discovery, beginner topic discovery, keyword insight reports, one-stop Xiaohongshu packages from a keyword/link/image/inspiration material, keyword-to-content packages, mother-content cross-platform distribution packages, weekly content update packages, WeChat benchmark-fit and original-writing workflows, five-mother-topic weekly planning, audience persona fit checks, Xiaohongshu title design, Xiaohongshu profile bio design, graphic notes, spoken scripts, Vlog storyboards, pre-publish readiness checks, publishing keyword design, draft rewrites, benchmark-copy template extraction, style/slot-based imitation, reference-image graphic notes, visual generation, travel handdrawn maps and food route maps, image-generation execution and Agent integration, cover/image style routing, post-publish data review, Word/HTML/webpage/knowledge-base packaging for dense outputs, product judgment, feedback iteration, creator distillation, content knowledge bases, monetization questions, human-touch follow-up loops, and post-diagnosis activation packages, read <skill_root>/playbooks/router-index.json first, select at most one primary plus two gate or support playbooks, and load only those selected files."
